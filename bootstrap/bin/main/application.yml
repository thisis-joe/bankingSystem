spring:
  application:
    name: banking-system
  datasource:
    url: jdbc:h2:mem:bankingsystem;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
