<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코어 뱅킹 SDUI 운영 콘솔</title>
    <link rel="stylesheet" href="/sdui-admin/styles.css">
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="topbar-copy">
                <p class="eyebrow">SDUI OPERATIONS CONSOLE</p>
                <h1 id="screen-title">화면 정의를 불러오는 중...</h1>
                <p id="screen-subtitle" class="subtitle">서버가 내려주는 JSON 화면 정의를 읽어 운영 콘솔을 렌더링합니다.</p>
            </div>
            <div class="topbar-meta">
                <div class="meta-box">
                    <span class="meta-label">화면 ID</span>
                    <strong id="screen-id">-</strong>
                </div>
                <div class="meta-box">
                    <span class="meta-label">마지막 갱신</span>
                    <strong id="generated-at">-</strong>
                </div>
                <div class="meta-box">
                    <span class="meta-label">자동 갱신</span>
                    <strong id="refresh-state">-</strong>
                </div>
                <button id="refresh-toggle" class="secondary-button" type="button">자동 새로고침 일시정지</button>
            </div>
        </header>

        <main id="screen-root" class="screen-grid"></main>
    </div>

    <template id="block-template">
        <section class="panel">
            <div class="panel-header">
                <div>
                    <p class="panel-eyebrow"></p>
                    <h2 class="panel-title"></h2>
                </div>
                <p class="panel-description"></p>
            </div>
            <div class="panel-body"></div>
        </section>
    </template>

    <script src="/sdui-admin/app.js"></script>
</body>
</html>
